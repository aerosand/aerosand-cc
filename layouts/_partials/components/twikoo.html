{{- $lang := site.Language.Lang | default `zh-CN` -}}

{{- with site.Params.comments.twikoo -}}
<div id="twikoo-hextra-container"></div>

<script>
  (function () {
    var el = document.getElementById('twikoo-hextra-container');
    if (!el) return;

    var s = document.createElement('script');
    s.src = '{{ .envId }}/twikoo.js';
    s.onload = function () {
      if (typeof twikoo === 'undefined') return;
      twikoo.init({
        envId: '{{ .envId }}',
        el: '#twikoo-hextra-container',
        lang: '{{ .lang | default $lang }}',
        path: window.location.pathname,
        {{- with .region }}
        region: '{{ . }}',
        {{- end }}
      });
    };
    s.onerror = function () {
      console.warn('Failed to load twikoo.js from {{ .envId }}');
    };
    document.body.appendChild(s);
  })();
</script>
{{- else -}}
  {{ warnf "twikoo is not configured" }}
{{- end -}}
