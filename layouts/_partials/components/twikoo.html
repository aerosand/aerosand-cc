{{- $lang := site.Language.Lang | default `zh-CN` -}}

{{- with site.Params.comments.twikoo -}}
<div id="twikoo-hextra-container"></div>

<script>
  (function () {
    var el = document.getElementById('twikoo-hextra-container');
    if (!el) return;

    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/twikoo@{{ .version | default `1` }}/dist/twikoo.all.min.js';
    s.crossOrigin = 'anonymous';
    s.onload = function () {
      if (typeof twikoo === 'undefined') return;
      twikoo.init({
        envId: '{{ .envId }}',
        el: '#twikoo-hextra-container',
        lang: '{{ .lang | default $lang }}',
        path: window.location.pathname,
        {{- with .region }}
        region: '{{ . }}',
        {{- end }}
      });
    };
    s.onerror = function () {
      el.innerHTML = '<p style="color: #999; padding: 1rem;">评论加载失败，请刷新重试</p>';
    };
    document.body.appendChild(s);
  })();
</script>
{{- else -}}
  {{ warnf "twikoo is not configured" }}
{{- end -}}
